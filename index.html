<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  /* no web fonts on purpose: Google Fonts is unreliable from Iran */
  body { background: #07070a; color: #f4f4f5; overflow: hidden;
         font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  .veil { position: fixed; inset: 0; pointer-events: none;
          background: radial-gradient(ellipse at center, rgba(7,7,10,.6) 0%, rgba(7,7,10,.05) 50%, rgba(7,7,10,.7) 100%); }
  main { position: relative; height: 100%; display: grid; place-content: center; justify-items: center;
         gap: 30px; padding: 16px; text-align: center; pointer-events: none; }
  h1 { font-weight: 200; line-height: 1; letter-spacing: -.05em; font-size: clamp(3.6rem, 16vw, 10.5rem); padding: 0 .06em;
       background: linear-gradient(120deg, #fff 35%, #7dd3c7 65%, #c4b5fd 92%); background-size: 200% 100%;
       -webkit-background-clip: text; background-clip: text; color: transparent; animation: sheen 9s ease-in-out infinite alternate; }
  .line { width: 56px; height: 1px; background: linear-gradient(90deg, transparent, #7dd3c7, transparent); }
  nav { display: flex; gap: 18px; pointer-events: auto; }
  nav a { width: 50px; height: 50px; display: grid; place-items: center; border-radius: 50%;
          border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.03); color: #e4e4e7;
          backdrop-filter: blur(6px); transition: border-color .3s, box-shadow .3s, transform .3s, color .3s; }
  nav a:hover, nav a:focus-visible { outline: none; color: #fff; border-color: #7dd3c7; transform: translateY(-3px);
          box-shadow: 0 0 28px rgba(125,211,199,.35); }
  nav svg { width: 20px; height: 20px; fill: currentColor; }
  .work { position: fixed; left: 50%; bottom: 36px; translate: -50% 0; white-space: nowrap;
          font-size: .72rem; letter-spacing: .4em; text-transform: uppercase; text-decoration: none; color: #a1a1aa;
          padding: 10px 4px 10px calc(4px + .4em); border-bottom: 1px solid transparent; transition: color .3s, border-color .3s; }
  .work span { color: #52525b; margin-right: .9em; }
  .work:hover, .work:focus-visible { outline: none; color: #fff; border-color: #7dd3c7; }
  .in { opacity: 0; transform: translateY(14px); animation: rise 1.4s cubic-bezier(.2,.7,.2,1) forwards; }
  .d1 { animation-delay: .2s } .d2 { animation-delay: .5s } .d3 { animation-delay: .75s } .d4 { animation-delay: 1.1s }
  @keyframes rise { to { opacity: 1; transform: none; } }
  @keyframes sheen { from { background-position: 0% 0; } to { background-position: 100% 0; } }
  @media (prefers-reduced-motion: reduce) { .in, h1 { animation: none; opacity: 1; transform: none; } }

<script>
// Flow field: particles drift along a slowly morphing sin/cos field and part around the cursor.
const HUE = 165, HUE_SPAN = 95; // teal -> violet
const c = document.getElementById('bg'), g = c.getContext('2d');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let w, h, ps = [], t = 0, mx = -1e4, my = -1e4;

function size() {
  const d = Math.min(devicePixelRatio || 1, 2);
  w = innerWidth; h = innerHeight;
  c.width = w * d; c.height = h * d;
  g.setTransform(d, 0, 0, d, 0, 0);
  g.fillStyle = '#07070a'; g.fillRect(0, 0, w, h);
  ps = Array.from({ length: Math.min(1400, Math.round(w * h / 1800)) },
    () => ({ x: Math.random() * w, y: Math.random() * h, hue: HUE + Math.random() * HUE_SPAN }));
}

function step() {
  t += 0.0018;
  g.fillStyle = 'rgba(7,7,10,.05)'; g.fillRect(0, 0, w, h);
  g.lineWidth = 1.2;
  for (const p of ps) {
    const a = Math.sin(p.x * .0028 + t) * Math.cos(p.y * .0035 - t * .7) * 3.6 + Math.sin((p.x + p.y) * .0009 + t * .4);
    let vx = Math.cos(a), vy = Math.sin(a);
    const dx = p.x - mx, dy = p.y - my, dd = dx * dx + dy * dy;
    if (dd < 25000) { const f = (1 - dd / 25000) * 2.4 / Math.sqrt(dd + 1); vx += dx * f; vy += dy * f; }
    const nx = p.x + vx * 1.3, ny = p.y + vy * 1.3;
    g.strokeStyle = `hsla(${p.hue},80%,70%,.7)`;
    g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(nx, ny); g.stroke();
    p.x = nx; p.y = ny;
    if (nx < 0 || nx > w || ny < 0 || ny > h) { p.x = Math.random() * w; p.y = Math.random() * h; }
  }
}

function loop() { step(); requestAnimationFrame(loop); }

addEventListener('resize', () => { size(); if (reduce) for (let i = 0; i < 260; i++) step(); });
addEventListener('pointermove', e => { mx = e.clientX; my = e.clientY; });
addEventListener('pointerleave', () => { mx = my = -1e4; });
size();
if (reduce) for (let i = 0; i < 260; i++) step(); // static texture, no animation
else loop();
</script>
